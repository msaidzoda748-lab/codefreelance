# CodeFreelance — Render Blueprint (free tier friendly)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: codefreelance
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: codefreelance-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      # Switch to cloudinary or s3 for persistent uploads on free tier:
      # - key: STORAGE_PROVIDER
      #   value: cloudinary
      # - key: CLOUDINARY_CLOUD_NAME
      #   sync: false
      # - key: CLOUDINARY_API_KEY
      #   sync: false
      # - key: CLOUDINARY_API_SECRET
      #   sync: false

databases:
  - name: codefreelance-db
    plan: free
    databaseName: codefreelance
    user: codefreelance
    postgresMajorVersion: "16"
